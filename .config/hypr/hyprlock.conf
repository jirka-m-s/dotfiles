background {
    monitor =
    path = screenshot # Použije rozostřený snímek obrazovky
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_fade_center = true
    outer_color = rgba(180, 190, 254, 1.0) # Lavender border
    inner_color = rgba(30, 30, 46, 0.8)   # Base background
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <i>Zadej heslo...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(180, 190, 254, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
